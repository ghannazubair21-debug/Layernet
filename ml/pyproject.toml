[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layernet-ml"
version = "0.1.0"
description = "Leakage-aware research pipeline for LayerNet fraud detection"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
temporal = ["torch>=2.6,<3"]

[project.scripts]
layernet-ml = "layernet_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
