name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: TypeScript, unit tests, and Playwright
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Feature-engineering tests (node:test)
        run: npm test

      - name: Component tests (Vitest)
        run: npm run test:vitest

      - name: Install Playwright Chromium and dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run e2e

  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  ml:
    name: ML unit tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements-lock-observed.txt

      # The observed lock (CPU-only torch) is the environment that produced the recorded ML results.
      - name: Install pinned ML dependencies
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          --extra-index-url https://pypi.org/simple
          -r ml/requirements-lock-observed.txt

      # Datasets and trained artifacts are Git-ignored; tests that need them skip themselves.
      - name: Run ML unit tests
        env:
          PYTHONPATH: ml/src:ml/tests
        run: python -m unittest discover -s ml/tests -v
